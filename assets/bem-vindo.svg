<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-label="Terminal animado com código Java que imprime: Bem-vindo ao meu perfil!">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1033"/>
      <stop offset="1" stop-color="#0D0818"/>
    </linearGradient>
  </defs>

  <style>
    .code{font-family:'Courier New',Consolas,monospace;font-size:17px;fill:#EDE9FE}
    .title{font-family:'Courier New',Consolas,monospace;font-size:13px;fill:#A78BFA}
    .k{fill:#C084FC}
    .t{fill:#A78BFA}
    .s{fill:#F5D0FE}

    .frame{animation:glow 3s ease-in-out infinite}
    .cur{animation:blink 1s steps(1) infinite}
    .l1{animation:a1 10s infinite}
    .l2{animation:a2 10s infinite}
    .l3{animation:a3 10s infinite}
    .l4{animation:a4 10s infinite}
    .l5{animation:a5 10s infinite}

    @keyframes glow{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes a1{0%,8%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes a2{0%,17%{opacity:0}19%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes a3{0%,26%{opacity:0}28%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes a4{0%,35%{opacity:0}37%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes a5{0%,44%{opacity:0}46%,92%{opacity:1}96%,100%{opacity:0}}
  </style>

  <rect class="frame" x="1" y="1" width="758" height="238" rx="14" fill="url(#bg)" stroke="#7C3AED" stroke-width="2"/>
  <line x1="1" y1="40" x2="759" y2="40" stroke="#7C3AED" stroke-opacity="0.5"/>
  <circle cx="24" cy="20" r="6" fill="#A855F7"/>
  <circle cx="44" cy="20" r="6" fill="#7C3AED"/>
  <circle cx="64" cy="20" r="6" fill="#4C1D95"/>
  <text class="title" x="380" y="25" text-anchor="middle">Bemvindo.java</text>

  <g class="l1">
    <text class="code" x="30" y="80"><tspan class="k">public class</tspan> <tspan class="t">Bemvindo</tspan> {</text>
  </g>
  <g class="l2">
    <text class="code" x="60" y="110"><tspan class="k">public static void</tspan> main(<tspan class="t">String</tspan>[] args) {</text>
  </g>
  <g class="l3">
    <text class="code" x="90" y="140"><tspan class="t">System</tspan>.out.println(<tspan class="s">"Bem-vindo ao meu perfil!"</tspan>);</text>
  </g>
  <g class="l4">
    <text class="code" x="60" y="170">}</text>
  </g>
  <g class="l5">
    <text class="code" x="30" y="200">}</text>
    <rect class="cur" x="44" y="185" width="10" height="19" fill="#C084FC"/>
  </g>
</svg>
